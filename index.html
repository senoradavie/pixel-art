<!DOCTYPE html>
<html>
<head>
  <title>Pixel Art Teacher Pro V3</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f4fff4;
    }

    input {
      padding: 8px;
      margin: 5px;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    #question {
      font-size: 22px;
      font-weight: bold;
      margin: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      margin: 20px auto;
      width: max-content;
    }

    .cell {
      width: 50px;
      height: 50px;
      border: 1px solid #ddd;
      background: white;
    }

    .correct {
      background: #4caf50;
    }
  </style>
</head>

<body>

<h1>🌸 Pixel Art Teacher Pro V3</h1>

<input id="name" placeholder="Student Name">
<input id="period" placeholder="Period">

<div id="question">Loading...</div>

<input id="answer" placeholder="Answer">
<button onclick="check()">Submit</button>

<div class="grid" id="grid"></div>

<script>

/* =========================
   🔧 LEVEL SYSTEM
   ========================= */

const level = {
  questionBank: [
    { q: "yo (hablar)", a: "hablo" },
    { q: "tú (comer)", a: "comes" },
    { q: "él (vivir)", a: "vive" },
    { q: "nosotros (hablar)", a: "hablamos" },
    { q: "ella (tener)", a: "tiene" },
    { q: "ellos (ir)", a: "van" },
    { q: "yo (ser)", a: "soy" },
    { q: "tú (estar)", a: "estás" }
  ],

  // EACH GROUP = ONE QUESTION SLOT
  patternGroups: [
    [2,3],
    [7,8],
    [12,13,14],
    [18],
    [20,21],
    [25]
  ]
};

/* =========================
   RANDOMIZER (REAL BANK SYSTEM)
   ========================= */

function shuffle(arr) {
  let a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const questions = shuffle(level.questionBank)
  .slice(0, level.patternGroups.length);

/* =========================
   GAME STATE
   ========================= */

const SCRIPT_URL = "PASTE_YOUR_GOOGLE_SCRIPT_URL_HERE";

const grid = document.getElementById("grid");
const questionEl = document.getElementById("question");

let current = 0;
let score = 0;

/* =========================
   BUILD GRID
   ========================= */

for (let i = 0; i < 36; i++) {
  let div = document.createElement("div");
  div.classList.add("cell");
  grid.appendChild(div);
}

/* =========================
   SHOW FIRST QUESTION
   ========================= */

questionEl.innerText = questions[current].q;

/* =========================
   CHECK ANSWER
   ========================= */

function check() {
  let input = document.getElementById("answer").value.toLowerCase().trim();

  if (input === questions[current].a) {

    // MULTI PIXEL FILL
    level.patternGroups[current].forEach(i => {
      grid.children[i].classList.add("correct");
    });

    current++;
    score++;

    document.getElementById("answer").value = "";

    if (current < questions.length) {
      questionEl.innerText = questions[current].q;
    } else {
      questionEl.innerText = "🌸 Completed!";
      alert("Score: " + score + "/" + questions.length);

      sendData();
    }

  } else {
    alert("Try again!");
  }
}

/* =========================
   SEND TO GOOGLE SHEETS
   ========================= */

function sendData() {
  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      name: document.getElementById("name").value,
      period: document.getElementById("period").value,
      score: score,
      total: questions.length
    })
  });
}

</script>

</body>
</html>
