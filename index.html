<!DOCTYPE html>
<html>
<head>
  <title>Teacher Pro Pixel Art V2</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f7fff7;
    }

    h1 { margin-top: 15px; }

    input {
      padding: 8px;
      margin: 5px;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    #question {
      font-size: 20px;
      font-weight: bold;
      margin: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      margin: 20px auto;
      width: max-content;
    }

    .cell {
      width: 50px;
      height: 50px;
      border: 1px solid #ddd;
      background: white;
    }

    .correct {
      background: #4caf50;
    }
  </style>
</head>

<body>

<h1>🌸 Pixel Art Teacher Pro V2</h1>

<input id="name" placeholder="Student Name">
<input id="period" placeholder="Period">

<div id="question">Loading...</div>

<input id="answer" placeholder="Answer">
<button onclick="check()">Submit</button>

<div class="grid" id="grid"></div>

<script>

/* =========================
   🔧 QUESTION + IMAGE BANK
   ========================= */

const levels = [
  {
    // 🌸 LEVEL 1 (tulip)
    items: [
      { q: "yo ___ (hablar)", a: "hablo" },
      { q: "tú ___ (comer)", a: "comes" },
      { q: "él ___ (vivir)", a: "vive" },
      { q: "nosotros ___ (hablar)", a: "hablamos" }
    ],

    // MULTI PIXEL PER ANSWER (tulip shape)
    pattern: [
      [2,3],
      [7,8],
      [12,13,14],
      [18],
    ]
  },

  {
    // 🌼 LEVEL 2 (sun)
    items: [
      { q: "yo ___ (vivir)", a: "vivo" },
      { q: "tú ___ (ser)", a: "eres" },
      { q: "él ___ (tener)", a: "tiene" },
      { q: "ellas ___ (ir)", a: "van" }
    ],

    // sun pattern
    pattern: [
      [0,1,2],
      [6,7,8],
      [12,13,14],
      [18,19],
    ]
  }
];

/* =========================
   RANDOM LEVEL SELECTOR
   ========================= */

const level = levels[Math.floor(Math.random() * levels.length)];
const items = level.items;
const pattern = level.pattern;

/* =========================
   SETUP GAME
   ========================= */

const SCRIPT_URL = "PASTE_YOUR_GOOGLE_SCRIPT_URL_HERE";

const grid = document.getElementById("grid");
const questionEl = document.getElementById("question");

let current = 0;
let score = 0;

// build grid
for (let i = 0; i < 36; i++) {
  let div = document.createElement("div");
  div.classList.add("cell");
  grid.appendChild(div);
}

// show first question
questionEl.innerText = items[current].q;

/* =========================
   GAME LOGIC
   ========================= */

function check() {
  let input = document.getElementById("answer").value.toLowerCase().trim();

  if (input === items[current].a) {

    // MULTIPLE PIXELS PER QUESTION
    pattern[current].forEach(i => {
      grid.children[i].classList.add("correct");
    });

    current++;
    score++;

    document.getElementById("answer").value = "";

    if (current < items.length) {
      questionEl.innerText = items[current].q;
    } else {
      questionEl.innerText = "🌸 Completed!";
      alert("Score: " + score + "/" + items.length);

      sendData();
    }

  } else {
    alert("Try again!");
  }
}

/* =========================
   SEND TO GOOGLE SHEETS
   ========================= */

function sendData() {
  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      name: document.getElementById("name").value,
      period: document.getElementById("period").value,
      score: score,
      total: items.length,
      level: "random"
    })
  });
}
</script>

</body>
</html>
