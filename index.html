<!DOCTYPE html>
<html>
<head>
  <title>Spring Pixel Art</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      margin: 20px auto;
      width: max-content;
    }

    .cell {
      width: 50px;
      height: 50px;
      border: 1px solid #ddd;
      background: white;
    }

    .correct {
      background: transparent;
    }

    input {
      padding: 8px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<h2>🌸 Spring Pixel Art Activity</h2>

<p>Type the correct answer to reveal the picture!</p>

<input id="answer" placeholder="Type answer here">
<button onclick="check()">Submit</button>

<div class="grid" id="grid"></div>

<script>
const grid = document.getElementById("grid");

// 🌸 SPRING PIXEL ART PATTERN (6x6 = 36 squares)
// This draws a simple tulip + sun + grass shape
const pattern = [
  2, 3, 4,
  7, 8, 9,
  12, 13, 14,
  19,
  22, 23, 24,
  27, 28, 29,
  32, 33, 34
];

// 🧠 ANSWERS (CHANGE THESE for your class!)
const answers = [
  "a", "b", "c",
  "d", "e", "f",
  "g", "h", "i",
  "j", "k", "l",
  "m", "n", "o",
  "p", "q", "r",
  "s", "t"
];

let current = 0;

// build grid
for (let i = 0; i < 36; i++) {
  let div = document.createElement("div");
  div.classList.add("cell");
  grid.appendChild(div);
}

function check() {
  let input = document.getElementById("answer").value.toLowerCase();

  if (input === answers[current]) {
    grid.children[pattern[current]].classList.add("correct");
    current++;
    document.getElementById("answer").value = "";
  } else {
    alert("Try again!");
  }

  if (current === answers.length) {
    alert("🌸 You revealed the spring picture!");
  }
}
</script>

</body>
</html>
