<!DOCTYPE html>
<html>
<head>
  <title>Spring Pixel Art</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f7fff7;
    }

    h1 {
      margin-top: 20px;
    }

    #question {
      font-size: 22px;
      margin: 20px;
      font-weight: bold;
    }

    input {
      padding: 10px;
      font-size: 16px;
      width: 200px;
    }

    button {
      padding: 10px 15px;
      font-size: 16px;
      margin-left: 5px;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      margin: 30px auto;
      width: max-content;
    }

    .cell {
      width: 50px;
      height: 50px;
      border: 1px solid #ddd;
      background: white;
    }

    .correct {
      background: #4caf50;
    }
  </style>
</head>

<body>

<h1>🌸 Spring Pixel Art Activity</h1>

<div id="question">Loading...</div>

<input id="answer" placeholder="Type answer">
<button onclick="check()">Submit</button>

<div class="grid" id="grid"></div>

<script>
/* =========================
   🌸 EDIT ONLY THIS SECTION
   ========================= */

// Questions + Answers (match order!)
const items = [
  { question: "yo ___ (hablar)", answer: "hablo" },
  { question: "tú ___ (comer)", answer: "comes" },
  { question: "él ___ (vivir)", answer: "vive" },
  { question: "nosotros ___ (hablar)", answer: "hablamos" },
  { question: "ellos ___ (comer)", answer: "comen" },
  { question: "yo ___ (vivir)", answer: "vivo" }
  { question: "12", answer: "12" }
    { question: "13", answer: "13" }
    { question: "14", answer: "14" }
    { question: "12", answer: "12" }
    { question: "12", answer: "12" }
    { question: "12", answer: "12" }
    { question: "12", answer: "12" }
    { question: "12", answer: "12" }
    { question: "12", answer: "12" }
    { question: "12", answer: "12" }
    { question: "12", answer: "12" }
    { question: "12", answer: "12" }
    { question: "32", answer: "32" }
];

// Pixel positions to reveal (6x6 grid = 36 squares)
const pattern = [
  2, 3, 4,
  7, 8, 9,
  12, 13, 14,
  18,
  21, 22, 23,
  27, 28, 29,
  32, 33, 34
];

/* =========================
   DO NOT EDIT BELOW THIS LINE
   ========================= */

const grid = document.getElementById("grid");
const questionEl = document.getElementById("question");

let current = 0;

// Build grid
for (let i = 0; i < 36; i++) {
  let div = document.createElement("div");
  div.classList.add("cell");
  grid.appendChild(div);
}

// Show first question
questionEl.innerText = items[current].question;

function check() {
  let input = document.getElementById("answer").value.toLowerCase().trim();

  if (input === items[current].answer) {

    // reveal pixel
    grid.children[pattern[current]].classList.add("correct");

    current++;
    document.getElementById("answer").value = "";

    // next question or finish
    if (current < items.length) {
      questionEl.innerText = items[current].question;
    } else {
      questionEl.innerText = "🌸 You revealed the spring picture!";
      alert("Great job!");
    }

  } else {
    alert("Try again!");
  }
}
</script>

</body>
</html>
