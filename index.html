<!DOCTYPE html>
<html>
<head>
  <title>Teacher Pro Pixel Art</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f7fff7;
    }

    h1 { margin-top: 20px; }

    input {
      padding: 8px;
      margin: 5px;
      font-size: 14px;
    }

    button {
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
    }

    #question {
      font-size: 20px;
      font-weight: bold;
      margin: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      margin: 20px auto;
      width: max-content;
    }

    .cell {
      width: 50px;
      height: 50px;
      border: 1px solid #ddd;
      background: white;
    }

    .correct {
      background: #4caf50;
    }
  </style>
</head>

<body>

<h1>🌸 Pixel Art Teacher Pro</h1>

<input id="name" placeholder="Student Name">
<input id="period" placeholder="Period">
<br>

<div id="question">Loading...</div>

<input id="answer" placeholder="Type answer">
<button onclick="check()">Submit</button>

<div class="grid" id="grid"></div>

<script>

/* =========================
   🔧 EDIT THIS SECTION ONLY
   ========================= */

const SCRIPT_URL = "PASTE_YOUR_GOOGLE_SCRIPT_URL_HERE";

const items = [
  { question: "yo ___ (hablar)", answer: "hablo" },
  { question: "tú ___ (comer)", answer: "comes" },
  { question: "él ___ (vivir)", answer: "vive" },
  { question: "nosotros ___ (hablar)", answer: "hablamos" },
  { question: "ellos ___ (comer)", answer: "comen" },
  { question: "yo ___ (vivir)", answer: "vivo" }
];

// Pixel pattern (6x6 grid = 36 cells)
const pattern = [
  2, 3, 4,
  7, 8, 9,
  12, 13, 14,
  18,
  21, 22, 23,
  27, 28, 29,
  32, 33, 34
];

/* =========================
   DO NOT EDIT BELOW
   ========================= */

const grid = document.getElementById("grid");
const questionEl = document.getElementById("question");

let current = 0;
let score = 0;

// build grid
for (let i = 0; i < 36; i++) {
  let div = document.createElement("div");
  div.classList.add("cell");
  grid.appendChild(div);
}

// show first question
questionEl.innerText = items[current].question;

function check() {
  let input = document.getElementById("answer").value.toLowerCase().trim();

  if (input === items[current].answer) {

    grid.children[pattern[current]].classList.add("correct");

    current++;
    score++;

    document.getElementById("answer").value = "";

    if (current < items.length) {
      questionEl.innerText = items[current].question;
    } else {

      questionEl.innerText = "🌸 Completed!";
      alert("Great job! Your score is " + score + "/" + items.length);

      sendData();
    }

  } else {
    alert("Try again!");
  }
}

function sendData() {
  let name = document.getElementById("name").value;
  let period = document.getElementById("period").value;

  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      name: name,
      period: period,
      score: score,
      total: items.length
    })
  });
}
</script>

</body>
</html>
