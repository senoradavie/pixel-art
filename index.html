<!DOCTYPE html>
<html>
<head>
  <title>Pixel Art Teacher Pro V4</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f4fff4;
    }

    input {
      padding: 8px;
      margin: 5px;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    #question {
      font-size: 22px;
      font-weight: bold;
      margin: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      margin: 20px auto;
      width: max-content;
    }

    .cell {
      width: 50px;
      height: 50px;
      border: 1px solid #ddd;
      background: white;
    }

    .correct {
      background: #4caf50;
    }
  </style>
</head>

<body>

<h1>🌸 Pixel Art Teacher Pro V4</h1>

<input id="name" placeholder="Student Name">
<input id="period" placeholder="Period">

<div id="question">Loading...</div>

<input id="answer" placeholder="Answer">
<button onclick="check()">Submit</button>

<div class="grid" id="grid"></div>

<script>

/* =========================
   🌼 QUESTION BANK (shared)
   ========================= */

const questionBank = [
  { q: "yo (hablar)", a: "hablo" },
  { q: "tú (comer)", a: "comes" },
  { q: "él (vivir)", a: "vive" },
  { q: "nosotros (hablar)", a: "hablamos" },
  { q: "ella (tener)", a: "tiene" },
  { q: "ellos (ir)", a: "van" },
  { q: "yo (ser)", a: "soy" },
  { q: "tú (estar)", a: "estás" },
  { q: "ella (hablar)", a: "habla" },
  { q: "nosotros (comer)", a: "comemos" }
];

/* =========================
   🌸 3 PIXEL ART IMAGES
   ========================= */

const images = [
  {
    name: "tulip",
    patternGroups: [
      [2,3],
      [7,8],
      [12,13,14],
      [18],
      [19,20]
    ]
  },

  {
    name: "sun",
    patternGroups: [
      [0,1,2],
      [6,7,8],
      [12,13,14],
      [18,19],
      [24]
    ]
  },

  {
    name: "sunflower",
    patternGroups: [
      [1,2,3],
      [7,8],
      [13,14,15],
      [19,20],
      [25,26]
    ]
  }
];

/* =========================
   🎲 RANDOM SELECTION
   ========================= */

function shuffle(arr) {
  let a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// pick random image
const selectedImage = images[Math.floor(Math.random() * images.length)];

// pick random questions matching number of pixel groups
const questions = shuffle(questionBank)
  .slice(0, selectedImage.patternGroups.length);

/* =========================
   GAME SETUP
   ========================= */

const SCRIPT_URL = "PASTE_YOUR_GOOGLE_SCRIPT_URL_HERE";

const grid = document.getElementById("grid");
const questionEl = document.getElementById("question");

let current = 0;
let score = 0;

// build grid (6x6 = 36 cells)
for (let i = 0; i < 36; i++) {
  let div = document.createElement("div");
  div.classList.add("cell");
  grid.appendChild(div);
}

questionEl.innerText = questions[current].q;

/* =========================
   GAME LOGIC
   ========================= */

function check() {
  let input = document.getElementById("answer").value.toLowerCase().trim();

  if (input === questions[current].a) {

    // fill multiple pixels
    selectedImage.patternGroups[current].forEach(i => {
      grid.children[i].classList.add("correct");
    });

    current++;
    score++;

    document.getElementById("answer").value = "";

    if (current < questions.length) {
      questionEl.innerText = questions[current].q;
    } else {
      questionEl.innerText = "🌸 Completed " + selectedImage.name + "!";
      alert("Score: " + score + "/" + questions.length);

      sendData();
    }

  } else {
    alert("Try again!");
  }
}

/* =========================
   SEND DATA (Google Sheets)
   ========================= */

function sendData() {
  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      name: document.getElementById("name").value,
      period: document.getElementById("period").value,
      score: score,
      total: questions.length,
      image: selectedImage.name
    })
  });
}

</script>

</body>
</html>
